defaults:
  - ppo_trainer
  - user
  - _self_

# Same max_model_len as SDPO (need room for 3x teacher contexts)
max_model_len: 18944

actor_rollout_ref:
  actor:
    ppo_mini_batch_size: 32
    policy_loss:
      loss_mode: sdpo
    self_distillation:
      max_reprompt_len: 10240
      is_clip: 2.0
      entropy_weighting: false
      entropy_temperature: 1.0
      entropy_weighting_version: "v4"
      # CV-SDPO leakage decontamination
      leakage_decontamination_enabled: true
      leakage_decontamination_mode: "control_variate"
      answer_context_source: "peer_success"
      cv_gamma: 0.5
      beta_mode: "adaptive"
      beta_fixed: 0.5
      beta_max: 1.0
      stop_gradient_clean_target: true
      fallback_when_no_success: "no_sdpo"
    optim:
      lr: 1e-5
  rollout:
    n: 8
    calculate_log_probs: True

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: False
  rollout_correction:
    rollout_is: token
    rollout_is_threshold: 2.0

data:
  train_batch_size: 32

trainer:
  val_before_train: False
